
services:
  db:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: movienight
      POSTGRES_USER: movienight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movienight -d movienight"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.2-bookworm
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://movienight:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/movienight
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
